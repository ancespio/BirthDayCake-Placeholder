<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1080" viewBox="0 0 900 1080" role="img" aria-labelledby="title desc">
  <title id="title">Photo placeholder</title>
  <desc id="desc">A simple birthday cake illustration used in place of a personal photo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff5e8" />
      <stop offset="1" stop-color="#f5dce4" />
    </linearGradient>
    <linearGradient id="cake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf7" />
      <stop offset="1" stop-color="#f1b7a5" />
    </linearGradient>
  </defs>
  <rect width="900" height="1080" fill="url(#bg)" />
  <circle cx="450" cy="460" r="300" fill="#ffffff" fill-opacity=".38" />
  <path d="M290 700h320l-34 125H324z" fill="url(#cake)" stroke="#b76e79" stroke-width="10" stroke-linejoin="round" />
  <path d="M330 615h240l-24 92H354z" fill="#fffdf7" stroke="#b76e79" stroke-width="10" stroke-linejoin="round" />
  <path d="M400 500v105m50-105v105m50-105v105" stroke="#d89a39" stroke-width="15" stroke-linecap="round" />
  <path d="M400 475c-24-25 24-36 0-64m50 64c-24-25 24-36 0-64m50 64c-24-25 24-36 0-64" fill="none" stroke="#e98570" stroke-width="13" stroke-linecap="round" />
  <ellipse cx="450" cy="830" rx="205" ry="34" fill="#fffdf7" stroke="#b76e79" stroke-width="10" />
  <text x="450" y="925" text-anchor="middle" fill="#6e4c54" font-family="Arial, sans-serif" font-size="36" letter-spacing="5">PHOTO PLACEHOLDER</text>
